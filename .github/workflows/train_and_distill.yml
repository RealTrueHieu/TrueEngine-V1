name: TrueEngine V1 Autonomous Model Training & Distillation CI

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of training epochs'
        required: false
        default: '2'
  schedule:
    # Run once every 6 hours (compliant with GitHub Actions limits)
    - cron: '0 */6 * * *'

jobs:
  train-and-distill:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install chess python-chess requests numpy

      - name: Install Stockfish 17.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y stockfish
          sudo ln -sf /usr/games/stockfish /usr/local/bin/stockfish

      - name: Run Model Training & Distillation Pipeline
        run: |
          python fetch_and_train_pipeline.py

      - name: Upload Trained Model Checkpoint Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trueengine-v1-supernet-checkpoint
          path: |
            models/trueengine_v1_supernet_latest.pt
            models/latest_training_stats.json
            books/experience_memory.json
          retention-days: 7
